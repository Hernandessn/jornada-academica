<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="utf-8" />
    <meta name="robots" content="noindex" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Entrar | VI Jornada Acadêmica da Uninassau Teresina</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600&family=Montserrat:wght@700;800&display=swap"
      rel="stylesheet"
    />
    <link
      href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
      rel="stylesheet"
    />
    <link
      href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css"
      rel="stylesheet"
    />
    <link href="css/tokens.css" rel="stylesheet" />
    <link href="css/components.css" rel="stylesheet" />
    <link href="css/paginas.css" rel="stylesheet" />
  </head>
  <body>
    <header id="app-navbar"></header>
    <main class="container">
      <div class="jr-card login-card">
        <h1 class="h3">Entrar</h1>
        <p class="legenda">Acesso para professores e administração.</p>
        <div
          id="aviso"
          class="jr-alerta jr-alerta-info mb-3"
          role="status"
          hidden
        >
          Sua sessão expirou. Entre novamente.
        </div>
        <div
          id="alerta-geral"
          class="jr-alerta jr-alerta-erro mb-3"
          role="alert"
          hidden
        ></div>
        <form id="form-login" novalidate>
          <div class="jr-campo">
            <label for="email">E-mail</label>
            <input
              class="jr-input"
              id="email"
              type="email"
              autocomplete="username"
              aria-describedby="erro-email"
              required
            />
            <p class="jr-msg-erro" id="erro-email" hidden></p>
          </div>
          <div class="jr-campo">
            <label for="senha">Senha</label>
            <input
              class="jr-input"
              id="senha"
              type="password"
              autocomplete="current-password"
              aria-describedby="erro-senha"
              required
            />
            <p class="jr-msg-erro" id="erro-senha" hidden></p>
          </div>
          <button
            class="jr-btn jr-btn-primario jr-btn-bloco"
            id="botao"
            type="submit"
          >
            <span
              class="spinner-border"
              role="status"
              aria-hidden="true"
              hidden
            ></span
            ><span id="texto-botao">Entrar</span>
          </button>
        </form>
      </div>
    </main>
    <div id="app-rodape"></div>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
    <script type="module" src="js/login.js"></script>
  </body>
</html>
