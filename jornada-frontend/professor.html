<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="utf-8" />
    <meta name="robots" content="noindex" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>
      Painel do professor | VI Jornada Acadêmica da Uninassau Teresina
    </title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600&family=Montserrat:wght@700;800&display=swap"
      rel="stylesheet"
    />
    <link
      href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
      rel="stylesheet"
    />
    <link
      href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css"
      rel="stylesheet"
    />
    <link href="css/tokens.css" rel="stylesheet" />
    <link href="css/components.css" rel="stylesheet" />
    <link href="css/paginas.css" rel="stylesheet" />
  </head>
  <body class="painel">
    <header class="topo-painel">
      <div
        class="container d-flex align-items-center justify-content-between gap-2"
      >
        <div>
          <strong>Painel do professor</strong
          ><span class="d-block legenda-topo" id="nome-usuario"></span>
        </div>
        <button class="jr-btn jr-btn-contorno-claro" id="sair" type="button">
          <i class="bi bi-box-arrow-left" aria-hidden="true"></i>Sair
        </button>
      </div>
    </header>
    <main class="container py-4">
      <div
        id="alerta-geral"
        class="jr-alerta jr-alerta-erro mb-3"
        role="alert"
        hidden
      ></div>
      <section class="resumo" aria-label="Resumo">
        <div class="jr-card">
          <span class="legenda">Total de inscritos</span
          ><strong id="total">–</strong>
        </div>
        <div class="jr-card">
          <span class="legenda">Presentes na sessão</span
          ><strong id="presentes">–</strong>
        </div>
        <div class="jr-card">
          <span class="legenda">Regra de presença</span
          ><strong id="regra">–</strong>
        </div>
      </section>
      <section class="jr-card mt-3" aria-labelledby="titulo-chamada">
        <h1 class="h4" id="titulo-chamada">Chamada de presença</h1>
        <div class="jr-campo">
          <label for="sessao">Sessão</label>
          <select class="jr-input" id="sessao"></select>
        </div>
        <div class="row g-2 align-items-end">
          <div class="col-md">
            <label for="busca" class="fw-semibold">Buscar</label>
            <input
              class="jr-input"
              id="busca"
              type="search"
              placeholder="Nome, matrícula ou CPF"
              autocomplete="off"
            />
          </div>
          <div class="col-md-auto">
            <button
              class="jr-btn jr-btn-contorno jr-btn-bloco"
              id="marcar-todos"
              type="button"
            >
              Selecionar todos os pendentes
            </button>
          </div>
        </div>
        <p class="legenda mt-3" id="carregando">Carregando…</p>
        <p class="legenda mt-3" id="vazio" hidden>Nenhum aluno encontrado.</p>
        <table class="jr-tabela mt-3" id="tabela" hidden>
          <thead>
            <tr>
              <th><span class="visually-hidden">Selecionar</span></th>
              <th>Nome</th>
              <th>Matrícula</th>
              <th>Curso</th>
              <th>Presença</th>
            </tr>
          </thead>
          <tbody id="linhas"></tbody>
        </table>
      </section>
    </main>
    <div class="barra-acao">
      <span id="contador" aria-live="polite">Nenhum aluno selecionado</span>
      <button class="jr-btn jr-btn-cta" id="salvar" type="button" disabled>
        <span
          class="spinner-border"
          role="status"
          aria-hidden="true"
          hidden
        ></span
        >Registrar presença
      </button>
    </div>
    <script type="module" src="js/professor.js"></script>
  </body>
</html>
