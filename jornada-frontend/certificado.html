<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Certificado | VI Jornada Acadêmica da Uninassau Teresina</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600&family=Montserrat:wght@700;800&display=swap"
      rel="stylesheet"
    />
    <link
      href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
      rel="stylesheet"
    />
    <link
      href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css"
      rel="stylesheet"
    />
    <link href="css/tokens.css" rel="stylesheet" />
    <link href="css/components.css" rel="stylesheet" />
    <link href="css/paginas.css" rel="stylesheet" />
  </head>
  <body>
    <header id="app-navbar"></header>
    <main class="container insc">
      <div class="jr-card insc-card">
        <h1 class="h2">Consulta de certificado</h1>
        <p class="legenda">
          Informe o CPF e o e-mail usados na inscrição para verificar a sua
          participação na VI Jornada Acadêmica.
        </p>
        <form id="form-consulta" novalidate>
          <div class="jr-campo">
            <label for="cpf">CPF</label>
            <input
              class="jr-input"
              id="cpf"
              type="text"
              inputmode="numeric"
              autocomplete="off"
              placeholder="000.000.000-00"
              aria-describedby="erro-cpf"
              required
            />
            <p class="jr-msg-erro" id="erro-cpf" hidden></p>
          </div>
          <div class="jr-campo">
            <label for="email">E-mail</label>
            <input
              class="jr-input"
              id="email"
              type="email"
              autocomplete="email"
              aria-describedby="erro-email"
              required
            />
            <p class="jr-msg-erro" id="erro-email" hidden></p>
          </div>
          <button
            class="jr-btn jr-btn-cta jr-btn-bloco"
            id="botao"
            type="submit"
          >
            <span
              class="spinner-border"
              role="status"
              aria-hidden="true"
              hidden
            ></span
            ><span id="texto-botao">Consultar</span>
          </button>
        </form>
        <div id="resultado" class="mt-3" aria-live="polite"></div>
      </div>
    </main>
    <div id="app-rodape"></div>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
    <script type="module" src="js/certificado.js"></script>
  </body>
</html>
